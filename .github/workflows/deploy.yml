name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/rental-space-map.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # SFTP は「消えたファイル」をサーバから削除しない（delete_remote_files: false）。
      # そのため、リポジトリから消したファイルがサーバに残り続ける。
      #
      # 実際、静的な sitemap.xml が残っていて、動的な /sitemap.xml のルートより
      # 先に Web サーバがそれを返していた。中身は Vercel のプレビュードメインのまま
      # だったため、サイトマップが別ドメインのURLを並べる状態になっていた。
      #
      # rm -f なので、既に無ければ何もしない。
      - name: Remove stale files left on the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p 10022 -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'rm -f /home/xs501620/rental-space-map.jp/public_html/sitemap.xml'
          rm -f ~/.ssh/deploy_key

      # public/ しか送っていなかったため、blade を直してもデプロイでは反映
      # されなかった。サーバ上では public_html が app/public へのシンボリック
      # リンクで、Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/rental-space-map.jp/app/            リポジトリのルート相当
      #   ~/rental-space-map.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      # Blade はコンパイル済みビューと元ファイルの更新時刻を比べるので、
      # アップロードすれば次のリクエストで作り直される。
      #
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/rental-space-map.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false

      # コントローラ・ルート・モデル・取り込みデータもサーバへ送る。
      # これらを送っていなかったため、都道府県ページを足しても本番では
      # ルートが無く404になっていた。
      - name: Deploy application code to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './app/*'
          remote_path: '/home/xs501620/rental-space-map.jp/app/app/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy routes to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './routes/*'
          remote_path: '/home/xs501620/rental-space-map.jp/app/routes/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy config to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './config/*'
          remote_path: '/home/xs501620/rental-space-map.jp/app/config/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy database files to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './database/*'
          remote_path: '/home/xs501620/rental-space-map.jp/app/database/'
          sftp_only: true
          delete_remote_files: false

      # 送った内容を反映させる。
      #   - migrate: 追加した列（city, facility_type, source など）を作る
      #   - OsmSpaceSeeder: 施設データを入れ直す（source+source_ref で上書き）
      #   - キャッシュ削除: ルートと設定を読み直させる
      #
      # php は PATH に無いことがあるため、実体を探してから使う。
      # 素の `php` を呼んだ初回のデプロイは、この行で失敗して取り込みが走らなかった。
      - name: Run migrations and import spaces
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/rental-space-map.jp/app
            PHP=$(command -v php8.3 || command -v php || echo /opt/php-8.3.30/bin/php)
            echo "php: $PHP ($($PHP -v | head -1))"
            $PHP artisan config:clear
            $PHP artisan route:clear
            $PHP artisan view:clear
            $PHP artisan cache:clear
            $PHP artisan migrate --force
            $PHP -d memory_limit=512M artisan db:seed --class=OsmSpaceSeeder --force
            echo "--- 取り込み後の施設件数 ---"
            $PHP artisan tinker --execute="echo \App\Models\Venue::count();"
